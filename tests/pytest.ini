[pytest]
python_files = tests*.py
# Pywinauto 1.0 still accepts the old search keywords (title, title_re, process,
# top_level_only...) but emits "[pywinauto>=0.7.0] Keyword is renamed" warnings.
# Turn them into errors so that no old keyword survives the migration.
filterwarnings =
    error:\[pywinauto>=0\.7\.0\]:DeprecationWarning
